<!DOCTYPE html>
<html>
<head>
    <title>MediRoute Allocation Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .explanation {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .chart-container {
            position: relative;
            height: 50vh;
            width: 100%;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 0.9em;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function AllocationChart({ data }) {
            const chartRef = React.useRef(null);

            React.useEffect(() => {
                if (!data || !data.time_steps || data.time_steps.length === 0) return;

                const ctx = chartRef.current.getContext('2d');
                // Destroy existing chart if any
                if (chartRef.current.chart) {
                    chartRef.current.chart.destroy();
                }

                const chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.time_steps,
                        datasets: [{
                            label: 'Old Engine Rank (Lower is Better)',
                            data: data.old_engine_ranks,
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            tension: 0.1,
                            fill: false,
                            pointRadius: 2,
                            pointHoverRadius: 4
                        }, {
                            label: 'New Engine Rank (with Model, Lower is Better)',
                            data: data.new_engine_ranks,
                            borderColor: '#27ae60',
                            backgroundColor: 'rgba(39, 174, 96, 0.1)',
                            tension: 0.1,
                            fill: false,
                            pointRadius: 2,
                            pointHoverRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Hospital Rank Over Time (Snapshot Tick)'
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: false,
                                title: {
                                    display: true,
                                    text: 'Rank'
                                },
                                // Reverse the axis so that rank 1 is at the top (better)
                                ticks: {
                                    stepSize: 1,
                                    callback: function(value) {
                                        return Number.isInteger(value) ? value : null;
                                    }
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Snapshot Tick (Time)'
                                }
                            }
                        }
                    }
                });

                chartRef.current.chart = chart;

                return () => {
                    if (chartRef.current.chart) {
                        chartRef.current.chart.destroy();
                    }
                };
            }, [data]);

            return <canvas ref={chartRef} />;
        }

        function App() {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                fetch('simulation_data.json')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(json => {
                        setData(json);
                        setLoading(false);
                    })
                    .catch(err => {
                        setError(err);
                        setLoading(false);
                    });
            }, []);

            if (loading) {
                return <div className="loading">Loading data...</div>;
            }

            if (error) {
                return <div className="loading">Error loading data: {error.message}</div>;
            }

            return (
                <div className="container">
                    <h1>MediRoute Allocation Dashboard</h1>

                    <div className="explanation">
                        <h2>Explanation of Decisions</h2>
                        <p><strong>Why we chose to show rank over time:</strong> Rank is an intuitive metric that shows how a hospital's relative standing changes as conditions evolve. A lower rank (closer to 1) indicates better allocation priority. This allows us to compare the effectiveness of the old rule‑based engine versus the new model‑enhanced engine across varying patient locations and hospital states.</p>
                        <p><strong>Why we used the model's availability probability:</strong> The MediRoute predictor estimates the likelihood that a resource (e.g., an ICU bed) will be available within a given horizon. This probability directly reflects the resource's readiness, making it a strong indicator for allocation. Combining it with travel distance (which affects how quickly a patient can reach the hospital) captures both clinical and logistical factors.</p>
                        <p><strong>How we combined model score and travel score:</strong> In the new engine, we replaced the resource match component of the old engine with the model's availability probability (scaled 0‑100). We kept the same weights for resource match (45%) and travel (30%) from the old engine, but renormalized them to sum to 1.0 (since we omitted freshness and specialization for simplicity in this comparison). Thus, the new score is 0.6 × model_score + 0.4 × travel_score.</p>
                        <p><strong>Data source:</strong> We used the synthetic resource snapshots (which provide time‑series hospital states) and hospital metadata. Patient location and requirement (ICU bed) were randomized for demonstration.</p>
                    </div>

                    <div className="chart-container">
                        <AllocationChart data={data} />
                    </div>

                    <p><em>Hospital of interest: {data?.hospital_of_interest} (lower rank = better allocation priority)</em></p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
